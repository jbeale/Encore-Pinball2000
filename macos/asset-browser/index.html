<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revenge From Mars Asset Browser</title>
<style>
  :root { --bg:#0b0d12; --panel:#141822; --line:#252b3a; --text:#e7eaf0; --muted:#8b93a7; --accent:#7ee787; --accent2:#5ac8fa; --mag:#ff3fd0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; height:100vh; display:grid; grid-template-rows:auto 1fr; }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header img { height:36px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { color:var(--muted); font-size:12px; }
  header .spacer { flex:1; }
  .tabs button { background:none; border:1px solid var(--line); color:var(--text); padding:6px 12px; border-radius:6px; cursor:pointer; }
  .tabs button.active { background:var(--accent); color:#000; border-color:var(--accent); }
  input[type=search] { background:var(--bg); border:1px solid var(--line); color:var(--text); padding:6px 10px; border-radius:6px; width:260px; }
  main { display:grid; grid-template-columns:minmax(320px, 1fr) minmax(420px, 1.2fr); min-height:0; }
  #list { overflow:auto; border-right:1px solid var(--line); padding:12px; display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; align-content:start; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px; cursor:pointer; display:flex; flex-direction:column; gap:6px; }
  .card:hover { border-color:var(--accent2); }
  .card.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .thumb { width:100%; height:80px; background:repeating-conic-gradient(#1a1f2b 0 25%, #10131a 0 50%) 0 0/16px 16px; border-radius:4px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .thumb canvas { max-width:100%; max-height:100%; image-rendering:pixelated; }
  .card .name { font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .meta { font-size:11px; color:var(--muted); }
  .card.snd .thumb { height:36px; font-family:ui-monospace, monospace; color:var(--accent2); font-size:12px; }
  #detail { overflow:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  #stage { background:repeating-conic-gradient(#1a1f2b 0 25%, #10131a 0 50%) 0 0/16px 16px; border:1px solid var(--line); border-radius:8px; display:flex; align-items:center; justify-content:center; min-height:280px; overflow:auto; padding:8px; }
  #stage.black { background:#000; }
  #stage canvas { image-rendering:pixelated; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .controls button, .controls select { background:var(--panel); border:1px solid var(--line); color:var(--text); padding:6px 10px; border-radius:6px; cursor:pointer; }
  .controls input[type=range] { flex:1; min-width:160px; }
  h2 { margin:0; font-size:18px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-size:12px; color:var(--muted); }
  .kv b { color:var(--text); font-weight:500; }
  .warn { color:#ffb454; font-size:12px; }
  #status { color:var(--muted); font-size:12px; }
  audio { width:100%; }
  .empty { color:var(--muted); padding:40px; text-align:center; }
</style>
</head>
<body>
<header>
  <img id="logo" alt="" hidden>
  <div><h1>Revenge From Mars</h1><div class="sub" id="subtitle">Pinball 2000 asset browser</div></div>
  <div class="spacer"></div>
  <div class="tabs"><button id="tabGfx" class="active">Graphics</button><button id="tabSnd">Sounds</button></div>
  <input id="search" type="search" placeholder="Filter by name…">
  <span id="status"></span>
</header>
<main>
  <div id="list"></div>
  <div id="detail"><div class="empty">Select an asset</div></div>
</main>
<script>
(async function () {
  const $ = s => document.querySelector(s);
  const list = $('#list'), detail = $('#detail'), search = $('#search'), status = $('#status');
  let data, mode = 'gfx', selected = null, player = null;
  const imgCache = new Map();

  try {
    data = await (await fetch('assets/index.json')).json();
  } catch (e) {
    list.innerHTML = '<div class="empty">assets/index.json not found. Run <code>python3 extract.py</code> first, then serve this folder with <code>python3 -m http.server</code>.</div>';
    return;
  }
  const logo = $('#logo'); logo.src = 'assets/p2klogo.gif'; logo.hidden = false;
  $('#subtitle').textContent = `${data.game} · ${data.animations.filter(a => a.status === 'ok').length} animations · ${data.sounds.length} sounds · extracted ${data.generated}`;

  function loadSheet(a) {
    if (imgCache.has(a.name)) return imgCache.get(a.name);
    const p = new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = 'assets/' + a.sheet; });
    imgCache.set(a.name, p); return p;
  }
  function drawFrame(ctx, a, im, i, scale) {
    const sx = (i % a.cols) * a.w, sy = Math.floor(i / a.cols) * a.h;
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    ctx.drawImage(im, sx, sy, a.w, a.h, 0, 0, a.w * scale, a.h * scale);
  }

  function render() {
    const q = search.value.trim().toLowerCase();
    list.innerHTML = '';
    const items = mode === 'gfx'
      ? data.animations.filter(a => !q || a.name.toLowerCase().includes(q))
      : data.sounds.filter(s => !q || s.name.toLowerCase().includes(q) || (s.label || '').toLowerCase().includes(q));
    status.textContent = `${items.length} shown`;
    const frag = document.createDocumentFragment();
    const io = new IntersectionObserver(entries => {
      for (const en of entries) if (en.isIntersecting) { io.unobserve(en.target); en.target._load && en.target._load(); }
    }, { root: list, rootMargin: '200px' });
    for (const it of items) {
      const card = document.createElement('div');
      card.className = 'card' + (mode === 'snd' ? ' snd' : '') + (selected === it ? ' sel' : '');
      if (mode === 'gfx') {
        const th = document.createElement('div'); th.className = 'thumb';
        const meta = it.status === 'ok' ? `${it.w}×${it.h} · ${it.nframes} fr · ${it.fps} fps` : (it.status || '?') + (it.formats ? ' fmt ' + it.formats.join('/') : '');
        card.appendChild(th);
        card.insertAdjacentHTML('beforeend', `<div class="name" title="${it.name}">${it.name}</div><div class="meta">${meta}</div>`);
        if (it.status === 'ok') {
          card._load = async () => {
            const im = await loadSheet(it);
            const c = document.createElement('canvas'); const s = Math.min(1, 140 / it.w, 76 / it.h);
            c.width = Math.max(1, Math.round(it.w * s)); c.height = Math.max(1, Math.round(it.h * s));
            const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
            ctx.drawImage(im, 0, 0, it.w, it.h, 0, 0, c.width, c.height); th.appendChild(c);
          };
          io.observe(card);
        } else th.textContent = '—';
      } else {
        card.insertAdjacentHTML('beforeend', `<div class="thumb">♪ ${it.name}</div><div class="name" title="${it.label}">${it.label || '(unnamed)'}</div><div class="meta">${(it.size / 1024).toFixed(0)} KB</div>`);
      }
      card.onclick = () => { selected = it; [...list.children].forEach(c => c.classList.remove('sel')); card.classList.add('sel'); show(it); };
      frag.appendChild(card);
    }
    list.appendChild(frag);
  }

  async function show(it) {
    if (player) { cancelAnimationFrame(player.raf); player = null; }
    detail.innerHTML = '';
    if (mode === 'snd') {
      detail.innerHTML = `<h2>${it.label || it.name}</h2>
        <div class="kv"><span>File</span><b>${it.file}</b><span>DCS track</span><b>${it.track != null ? '0x' + it.track.toString(16).toUpperCase().padStart(4, '0') : '—'}</b><span>Size</span><b>${it.size} bytes</b></div>
        <audio controls autoplay src="assets/sounds/${it.file}"></audio>
        <a href="assets/sounds/${it.file}" download>Download OGG</a>`;
      return;
    }
    if (it.status !== 'ok') {
      detail.innerHTML = `<h2>${it.name}</h2><div class="warn">Not decoded: ${it.status}${it.error ? ' — ' + it.error : ''}${it.formats ? ' (frame formats ' + it.formats.join(', ') + ')' : ''}</div>`;
      return;
    }
    const im = await loadSheet(it);
    const scale0 = Math.max(1, Math.min(4, Math.floor(600 / it.w), Math.floor(400 / it.h)));
    detail.innerHTML = `<h2>${it.name}</h2>
      <div class="kv"><span>Size</span><b>${it.w} × ${it.h}</b><span>Frames</span><b>${it.nframes}</b><span>Rate</span><b>${it.fps} fps</b><span>Colours</span><b>${it.colors}</b><span>Encoding</span><b>format ${it.formats.join(', ')}</b><span>ROM</span><b>bank ${it.bank} @ 0x${it.ptr}</b></div>
      <div class="controls">
        <button id="play">⏸ Pause</button>
        <input id="scrub" type="range" min="0" max="${it.nframes - 1}" value="0">
        <span id="fno">1 / ${it.nframes}</span>
        <select id="zoom">${[1,2,3,4,6].map(z => `<option value="${z}" ${z === scale0 ? 'selected' : ''}>${z}×</option>`).join('')}</select>
        <select id="speed"><option value="0.25">¼ speed</option><option value="0.5">½ speed</option><option value="1" selected>1× speed</option><option value="2">2× speed</option></select>
        <button id="bg">Black background</button>
        <a href="assets/${it.sheet}" download>Sprite sheet PNG</a>
      </div>
      <div id="stage"><canvas id="cv"></canvas></div>
      ${it.warnings ? `<div class="warn">${it.warnings} frame(s) ended early in the byte stream.</div>` : ''}`;
    const cv = $('#cv'), ctx = cv.getContext('2d');
    const st = { i: 0, playing: it.nframes > 1, scale: scale0, speed: 1, last: 0, raf: 0 };
    const resize = () => { cv.width = it.w * st.scale; cv.height = it.h * st.scale; drawFrame(ctx, it, im, st.i, st.scale); };
    resize();
    const tick = t => {
      if (st.playing && t - st.last >= 1000 / (it.fps * st.speed)) { st.last = t; st.i = (st.i + 1) % it.nframes; $('#scrub').value = st.i; $('#fno').textContent = `${st.i + 1} / ${it.nframes}`; drawFrame(ctx, it, im, st.i, st.scale); }
      st.raf = requestAnimationFrame(tick);
    };
    st.raf = requestAnimationFrame(tick); player = st;
    $('#play').onclick = () => { st.playing = !st.playing; $('#play').textContent = st.playing ? '⏸ Pause' : '▶ Play'; };
    $('#scrub').oninput = e => { st.playing = false; $('#play').textContent = '▶ Play'; st.i = +e.target.value; $('#fno').textContent = `${st.i + 1} / ${it.nframes}`; drawFrame(ctx, it, im, st.i, st.scale); };
    $('#zoom').onchange = e => { st.scale = +e.target.value; resize(); };
    $('#speed').onchange = e => { st.speed = +e.target.value; };
    $('#bg').onclick = () => $('#stage').classList.toggle('black');
  }

  $('#tabGfx').onclick = () => { mode = 'gfx'; $('#tabGfx').classList.add('active'); $('#tabSnd').classList.remove('active'); render(); };
  $('#tabSnd').onclick = () => { mode = 'snd'; $('#tabSnd').classList.add('active'); $('#tabGfx').classList.remove('active'); render(); };
  search.oninput = render;
  render();
})();
</script>
</body>
</html>
